                <div className="flex bg-dark-900/80 border border-dark-800 rounded-lg p-1 backdrop-blur">
                  {[['workspace','Workspace'],['search','Search'],['review','Review & activity']].map(([id,label])=><button key={id} onClick={()=>setDemoMode(id)} className={`px-3 py-2 text-xs rounded-md transition-all ${demoMode===id?'bg-dark-700 text-white':'text-gray-500 hover:text-gray-300'}`}>{label}</button>)}
                </div>
              </div>

              <div className="demo-shell border border-white/10 bg-dark-950/80 backdrop-blur-2xl rounded-2xl overflow-hidden shadow-2xl">
                <div className="flex items-center gap-2 px-4 py-3 border-b border-white/5 bg-white/[.02]">
                  <span className="w-2 h-2 rounded-full bg-gray-500"></span><span className="w-2 h-2 rounded-full bg-gray-700"></span><span className="w-2 h-2 rounded-full bg-gray-800"></span>
                  <span className="ml-3 text-[10px] font-mono text-gray-600">nexusdocs / Product Engineering</span>
                  <span className="ml-auto text-[10px] font-mono text-gray-600">LIVE PREVIEW</span>
                </div>

                {demoMode==='workspace' && <div className="grid lg:grid-cols-[180px_1fr_280px] min-h-[500px]">
                  <div className="border-r border-white/5 p-4 bg-black/10">
                    <div className="text-[9px] font-mono uppercase tracking-widest text-gray-600 mb-3">Workspaces</div>
                    {workspaces.map((w,i)=><button key={w.name} onClick={()=>setQuery('')} className={`w-full text-left px-3 py-2.5 rounded-lg mb-1 text-[11px] ${i===0?'bg-dark-800 text-gray-200':'text-gray-600 hover:text-gray-400'}`}>{w.name}<span className="block text-[9px] text-gray-700 mt-1">{w.count} documents</span></button>)}
                  </div>
                  <div className="p-5 overflow-y-auto">
                    <div className="flex items-center justify-between mb-5"><div><div className="text-[9px] font-mono text-gray-600 uppercase">Documents</div><div className="text-lg text-white mt-1">Product Engineering</div></div><button onClick={()=>{addEvent('created','You','New document');}} className="text-[10px] border border-dark-700 px-3 py-2 rounded-lg text-gray-300 hover:bg-dark-800">+ New document</button></div>
                    <div className="space-y-2">
                      {demoDocs.map(d=><button key={d.id} onClick={()=>setActiveDoc(d.id)} className={`w-full text-left p-4 rounded-xl border transition-all ${activeDoc===d.id?'border-gray-500 bg-dark-800/80':'border-dark-800 bg-dark-900/40 hover:border-dark-600'}`}><div className="flex justify-between"><span className="text-sm text-gray-200">{d.title}</span><span className="text-[9px] font-mono text-gray-600">{d.updated}</span></div><div className="text-[10px] text-gray-600 mt-2">{d.type} · {d.author} · {d.comments} comments</div><div className="text-xs text-gray-500 mt-3 leading-relaxed">{d.content}</div></button>)}
                    </div>
                  </div>
                  <div className="border-l border-white/5 p-5 bg-white/[.015]">
                    <div className="text-[9px] font-mono uppercase tracking-widest text-gray-600 mb-4">Document details</div>
                    <div className="text-lg text-white">{selectedDoc.title}</div><div className="text-[10px] text-gray-600 mt-1">{selectedDoc.type} · updated {selectedDoc.updated}</div>
                    <p className="text-sm text-gray-500 leading-relaxed mt-5">{selectedDoc.content}</p>
                    <div className="mt-6 pt-5 border-t border-white/5"><div className="text-[9px] font-mono text-gray-600 uppercase">Collaboration</div><div className="text-sm text-gray-300 mt-2">{selectedDoc.comments} comments</div><div className="text-[10px] text-gray-600 mt-1">Review and discuss the document with your team.</div></div>
                  </div>
                </div>}

                {demoMode==='search' && <div className="min-h-[500px] p-6 md:p-10">
                  <div className="max-w-3xl mx-auto"><div className="text-[9px] font-mono uppercase tracking-widest text-gray-600 mb-3">Find information across your workspace</div><div className="relative"><Icons.Search/><input autoFocus value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search documents by title or content..." className="w-full mt-2 pl-10 pr-4 py-4 bg-dark-900 border border-dark-700 rounded-xl outline-none text-gray-200 placeholder-gray-600 focus:border-gray-500" /></div><div className="mt-7 text-[10px] font-mono text-gray-600 uppercase">{filteredDocs.length} matching documents</div><div className="mt-3 space-y-2">{filteredDocs.map(d=><button key={d.id} onClick={()=>{setActiveDoc(d.id);setDemoMode('workspace')}} className="w-full text-left p-4 border border-dark-800 bg-dark-900/50 hover:border-dark-600 rounded-xl"><div className="flex justify-between"><span className="text-sm text-gray-200">{d.title}</span><span className="text-[9px] font-mono text-gray-600">{d.type}</span></div><p className="text-xs text-gray-500 mt-2">{d.content}</p><div className="text-[9px] text-gray-700 mt-3">Updated {d.updated} · {d.comments} comments</div></button>)}{filteredDocs.length===0&&<div className="py-14 text-center text-sm text-gray-600">No documents match “{query}”.</div>}</div></div>
                </div>}

                {demoMode==='review' && <div className="grid lg:grid-cols-[1fr_320px] min-h-[500px]">
                  <div className="p-6 md:p-10"><div className="text-[9px] font-mono uppercase tracking-widest text-gray-600">Reviewing</div><h3 className="text-2xl text-white mt-2">{selectedDoc.title}</h3><p className="text-sm text-gray-500 mt-4 max-w-2xl leading-relaxed">{selectedDoc.content}</p><div className="mt-8 border border-dark-800 rounded-xl bg-dark-900/50 p-5"><div className="text-[9px] font-mono uppercase text-gray-600 mb-4">Comments</div>{comments.map((c,i)=><div key={i} className="pb-4 mb-4 border-b border-white/5"><div className="flex justify-between"><span className="text-xs text-gray-300">{c.author}</span><span className="text-[9px] font-mono text-gray-600">{c.time}</span></div><p className="text-xs text-gray-500 mt-2">{c.text}</p></div>)}<div className="flex gap-2"><input value={comment} onChange={e=>setComment(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addComment()} placeholder="Add a review comment..." className="flex-1 bg-dark-950 border border-dark-800 rounded-lg px-3 py-2.5 text-xs outline-none text-gray-300 placeholder-gray-700"/><button onClick={addComment} className="bg-gray-200 text-dark-950 px-4 rounded-lg text-xs font-semibold">Comment</button></div></div></div>
                  <div className="border-l border-white/5 p-5 bg-white/[.015]"><div className="text-[9px] font-mono uppercase tracking-widest text-gray-600 mb-4">Activity history</div><div className="space-y-1">{events.map((e,i)=><div key={i} className="py-3 border-b border-white/5"><div className="text-[10px] font-mono text-gray-500">{e.action}</div><div className="text-xs text-gray-300 mt-1"><span className="text-gray-500">{e.actor}</span> · {e.text}</div><div className="text-[9px] text-gray-700 mt-1">{e.time}</div></div>)}</div><button onClick={()=>addEvent('updated','You',selectedDoc.title)} className="mt-5 w-full border border-dark-700 hover:bg-dark-800 rounded-lg py-2.5 text-xs text-gray-300">Simulate document update</button></div>
                </div>}
              </div>
            </section>

            <section className="max-w-7xl mx-auto mt-20 grid md:grid-cols-3 gap-4">
              {[
                ['Find it','Search your workspace instead of digging through folders.'],
                ['Review it','Comment directly on documents and keep discussion with the knowledge.'],
                ['Trace it','Use the activity history to understand what changed and when.']
              ].map(([title,text])=><div key={title} className="border border-white/5 bg-dark-950/50 backdrop-blur rounded-xl p-6"><div className="text-sm font-medium text-white">{title}</div><p className="text-sm text-gray-600 mt-2 leading-relaxed">{text}</p></div>)}
            </section>
          </main>
        </div>
      );
    }

    function AuthModal({ initialMode, onClose, onLogin, api }) {
      const [isSignUp, setIsSignUp] = useState(initialMode === 'signup');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const modalRef = useRef(null);

      useEffect(() => {
        if(window.gsap && modalRef.current) {
          gsap.fromTo(modalRef.current, { scale: 0.95, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.5)" });
        }
      }, []);

      const handleSubmit = async (e) => {
        e.preventDefault(); setError(''); setLoading(true);
        try {
          let result;
          if (isSignUp) {
            result = await api('/api/collections/users/records', {
              method: 'POST', body: JSON.stringify({ email, password, passwordConfirm: password, name })
            });
            result = await api('/api/collections/users/auth-with-password', {
              method: 'POST', body: JSON.stringify({ identity: email, password })
            });
          } else {
            result = await api('/api/collections/users/auth-with-password', {
              method: 'POST', body: JSON.stringify({ identity: email, password })
            });
          }
          onLogin(result.token, result.record);
        } catch (err) { setError(err.message); } 
        finally { setLoading(false); }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-dark-950/70 backdrop-blur-md">
          <div ref={modalRef} className="relative w-full max-w-md glass-panel rounded-2xl shadow-float p-8 border border-dark-700/50">
            <button onClick={onClose} className="absolute top-5 right-5 text-gray-500 hover:text-gray-300 transition-colors p-1 rounded-md hover:bg-dark-800">
              <Icons.Close />
            </button>
            
            <div className="mb-8">
              <div className="w-10 h-10 bg-dark-800 border border-dark-700 rounded-xl flex items-center justify-center text-accent-400 mb-4 shadow-inner">
                <Icons.Logo />
              </div>
              <h2 className="text-2xl font-bold text-gray-100 tracking-tight">{isSignUp ? 'Initialize Node' : 'System Authorization'}</h2>
              <p className="text-gray-500 mt-2 text-sm font-light leading-relaxed">{isSignUp ? 'Create your profile to deploy a secure workspace.' : 'Enter credentials to access the knowledge matrix.'}</p>
            </div>

            {error && (
              <div className="mb-6 p-4 bg-red-950/20 border border-red-900/50 text-red-400 text-xs rounded-lg font-mono">
                ERR: {error}
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-5">
              {isSignUp && (
                <div>
                  <label className="block text-[10px] font-mono font-medium uppercase tracking-widest text-gray-500 mb-2">Designation</label>
                  <input type="text" required value={name} onChange={e => setName(e.target.value)} 
                    className="w-full px-4 py-3 bg-dark-900/50 border border-dark-700 rounded-xl focus:border-accent-500 focus:ring-1 focus:ring-accent-500/50 focus:outline-none transition-all text-sm text-gray-100 placeholder-gray-600 shadow-inner" placeholder="Operator Name" />
                </div>
              )}
              <div>
                <label className="block text-[10px] font-mono font-medium uppercase tracking-widest text-gray-500 mb-2">Network ID (Email)</label>
                <input type="email" required value={email} onChange={e => setEmail(e.target.value)} 
                  className="w-full px-4 py-3 bg-dark-900/50 border border-dark-700 rounded-xl focus:border-accent-500 focus:ring-1 focus:ring-accent-500/50 focus:outline-none transition-all text-sm text-gray-100 placeholder-gray-600 shadow-inner" placeholder="id@network.com" />
              </div>
              <div>
                <label className="block text-[10px] font-mono font-medium uppercase tracking-widest text-gray-500 mb-2">Passkey</label>
                <input type="password" required minLength="8" value={password} onChange={e => setPassword(e.target.value)} 
                  className="w-full px-4 py-3 bg-dark-900/50 border border-dark-700 rounded-xl focus:border-accent-500 focus:ring-1 focus:ring-accent-500/50 focus:outline-none transition-all text-sm text-gray-100 placeholder-gray-600 shadow-inner" placeholder="••••••••" />
              </div>
              
              <button type="submit" disabled={loading} 
                className="tactile-button w-full py-3.5 text-gray-200 font-semibold rounded-xl transition-all disabled:opacity-70 mt-6 text-sm flex items-center justify-center gap-2">
                {loading ? <span className="w-4 h-4 border-2 border-t-transparent border-gray-400 rounded-full animate-spin"></span> : null}
                {loading ? 'Processing...' : (isSignUp ? 'Initialize' : 'Authenticate')}
              </button>
            </form>

            <div className="mt-8 text-center border-t border-dark-800/50 pt-6">
              <button onClick={() => { setIsSignUp(!isSignUp); setError(''); }} type="button" 
                className="text-xs font-mono text-gray-500 hover:text-gray-300 transition-colors uppercase tracking-widest">
                {isSignUp ? 'Existing Node? Sign in' : "New Operator? Sign up"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function MainApp({ user, api, onLogout, showToast }) {
      const [workspaces, setWorkspaces] = useState([]);
      const [activeWorkspace, setActiveWorkspace] = useState(null);
      const [activeDocument, setActiveDocument] = useState(null);
      const [showActivityLog, setShowActivityLog] = useState(false);
      const [myRole, setMyRole] = useState(null);
      const searchInputRef = useRef(null);

      const [pinnedDocs, setPinnedDocs] = useState(() => JSON.parse(localStorage.getItem('nd_pinned') || '[]'));

      useEffect(() => { loadWorkspaces(); }, []);
      useEffect(() => { localStorage.setItem('nd_pinned', JSON.stringify(pinnedDocs)); }, [pinnedDocs]);

      useEffect(() => {
        let cancelled = false;
        if (!activeWorkspace) {
          setMyRole(null);
          return;
        }
        setMyRole(null);
        fetchMyRole(api, activeWorkspace, user.id).then(role => {
          if (!cancelled) setMyRole(role);
        });
        return () => { cancelled = true; };
      }, [activeWorkspace?.id, user.id]);

      // Global Keyboard Shortcut: Ctrl+K
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            if (searchInputRef.current) searchInputRef.current.focus();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const togglePin = (docId, e) => {
        if(e) e.stopPropagation();
        setPinnedDocs(prev => prev.includes(docId) ? prev.filter(id => id !== docId) : [...prev, docId]);
      };

      const loadWorkspaces = async () => {
        try {
          const res = await api('/api/collections/workspaces/records?sort=-created');
          const loaded = res.items || [];
          setWorkspaces(loaded);
          if (loaded.length > 0 && !activeWorkspace) setActiveWorkspace(loaded[0]);
        } catch (err) { showToast('Error fetching workspaces'); }
      };

      const selectWorkspace = (ws) => {
        setActiveWorkspace(ws);
        setActiveDocument(null);
        setShowActivityLog(false);
      }

      return (
        <div className="flex flex-1 h-screen overflow-hidden bg-dark-950">
          <Sidebar user={user} workspaces={workspaces} activeWorkspace={activeWorkspace} 
            onSelectWorkspace={selectWorkspace} onWorkspaceCreated={loadWorkspaces} 
            api={api} onLogout={onLogout} showToast={showToast}
            onShowActivity={() => { setShowActivityLog(true); setActiveDocument(null); }}
            isShowingActivity={showActivityLog} />
            
          <main className="flex-1 flex flex-col h-full overflow-hidden bg-dark-950 z-10 border-l border-dark-800">
            {showActivityLog ? (
              <ActivityDashboard api={api} />
            ) : activeWorkspace ? (
              activeDocument ? (
                <DocumentDetail workspace={activeWorkspace} doc={activeDocument} api={api} user={user} myRole={myRole}
                  onBack={() => setActiveDocument(null)} onUpdate={(updatedDoc) => setActiveDocument(updatedDoc)}
                  onDelete={() => setActiveDocument(null)} showToast={showToast} 
                  isPinned={pinnedDocs.includes(activeDocument.id)} onTogglePin={() => togglePin(activeDocument.id)} />
              ) : (
                <WorkspaceView workspace={activeWorkspace} api={api} user={user} myRole={myRole} onSelectDocument={setActiveDocument} showToast={showToast} pinnedDocs={pinnedDocs} onTogglePin={togglePin} searchInputRef={searchInputRef} />
              )
            ) : (
              <div className="flex-1 flex flex-col items-center justify-center text-gray-600 bg-dark-900/30">
                <div className="w-16 h-16 rounded-full border border-dark-800 bg-dark-950 flex items-center justify-center mb-6 shadow-tactile text-dark-700">
                  <Icons.Folder />
                </div>
                <p className="font-mono text-xs uppercase tracking-widest text-gray-500">Initialize a workspace to begin</p>
              </div>
            )}
          </main>
        </div>
      );
    }

    function Sidebar({ user, workspaces, activeWorkspace, onSelectWorkspace, onWorkspaceCreated, api, onLogout, showToast, onShowActivity, isShowingActivity }) {
      const [newWsName, setNewWsName] = useState('');
      const [creating, setCreating] = useState(false);

      const handleCreate = async (e) => {
        e.preventDefault(); if (!newWsName.trim()) return;
        setCreating(true);
        try {
          await api('/api/collections/workspaces/records', { method: 'POST', body: JSON.stringify({ wname: newWsName, owner: user.id }) });
          setNewWsName(''); onWorkspaceCreated(); showToast('Workspace initialized.');
        } catch (err) { showToast('Error creating workspace.'); } 
        finally { setCreating(false); }
      };

      return (
        <div className="w-64 bg-dark-950 flex flex-col h-full flex-shrink-0 font-sans border-r border-dark-800/50">
          <div className="p-6 pb-4">
            <div className="flex items-center gap-3 text-gray-200 mb-6 font-semibold">
              <div className="text-accent-500"><Icons.Logo /></div>
              <span className="text-sm tracking-tight">NexusDocs</span>
            </div>
          </div>

          <div className="px-4 py-2">
            <button onClick={onShowActivity} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all text-left ${isShowingActivity ? 'bg-dark-800 text-gray-200 shadow-inner' : 'text-gray-500 hover:bg-dark-900 hover:text-gray-300'}`}>
              <Icons.Activity /> Telemetry
            </button>
          </div>

          <div className="px-4 py-4 flex-1 overflow-y-auto no-scrollbar">
            <div className="text-[10px] font-mono font-medium text-gray-600 uppercase tracking-widest mb-3 px-3 mt-4">Workspaces</div>
            <div className="space-y-1">
              {workspaces.map(ws => (
                <button key={ws.id} onClick={() => onSelectWorkspace(ws)}
                  className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all text-left ${!isShowingActivity && activeWorkspace?.id === ws.id ? 'bg-dark-800 text-gray-200 shadow-inner border border-dark-700/50' : 'text-gray-500 hover:bg-dark-900 hover:text-gray-300 border border-transparent'}`}>
                  <div className={!isShowingActivity && activeWorkspace?.id === ws.id ? "text-accent-400" : ""}><Icons.Folder /></div> 
                  <span className="truncate">{ws.wname}</span>
                </button>
              ))}
            </div>

            <form onSubmit={handleCreate} className="mt-6 px-1">
              <div className="relative group">
                <input type="text" placeholder="New workspace..." value={newWsName} onChange={e => setNewWsName(e.target.value)}
                  className="w-full bg-dark-900 border border-dark-800 rounded-lg px-4 py-2.5 text-xs text-gray-300 placeholder-gray-600 focus:outline-none focus:border-accent-600 transition-colors shadow-inner" />
                {newWsName && (
                  <button type="submit" disabled={creating} className="absolute right-2 top-2 p-1.5 bg-dark-700 text-gray-300 rounded hover:bg-dark-600 transition-colors flex items-center justify-center">
                    {creating ? <span className="w-3 h-3 border border-t-gray-300 rounded-full animate-spin"></span> : <Icons.Plus/>}
                  </button>
                )}
              </div>
            </form>
          </div>

          <div className="p-5 border-t border-dark-800/50 bg-dark-900/20 mt-auto">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-9 h-9 rounded-lg border border-dark-700 bg-dark-800 text-gray-400 flex items-center justify-center font-bold text-xs shadow-inner">
                {(user?.name || user?.email || 'U')[0].toUpperCase()}
              </div>
              <div className="flex-1 min-w-0">
                <div className="font-medium text-gray-300 text-sm truncate">{user?.name || 'User'}</div>
                <div className="text-[10px] text-gray-500 truncate font-mono">{user?.email}</div>
              </div>
            </div>
            <button onClick={onLogout} className="flex items-center justify-center gap-2 text-[10px] font-mono uppercase tracking-widest text-gray-500 hover:text-gray-200 bg-dark-900 hover:bg-dark-800 py-2.5 rounded-lg transition-colors w-full border border-dark-800 shadow-sm">
              <Icons.LogOut /> Disconnect
            </button>
          </div>
        </div>
      );
    }

    function ActivityDashboard({ api }) {
      const [logs, setLogs] = useState([]);
      const [loading, setLoading] = useState(true);
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        const fetchLogs = async () => {
          try {
            const res = await api('/api/collections/activity_log/records?sort=-created&expand=user,workspace&limit=100');
            const items = res.items || [];
            setLogs(items);
            renderChart(items);
          } catch (err) { console.error(err); } 
          finally { setLoading(false); }
        };
        fetchLogs();
        return () => { if(chartInstance.current) chartInstance.current.destroy(); }
      }, []);

      const renderChart = (dataLogs) => {
        if (!chartRef.current || !window.Chart) return;
        if (chartInstance.current) chartInstance.current.destroy();

        const counts = {};
        const today = new Date();
        for(let i=6; i>=0; i--) {
           let d = new Date(today);
           d.setDate(d.getDate() - i);
           counts[d.toLocaleDateString()] = 0;
        }
        
        dataLogs.forEach(log => {
           const d = new Date(log.created).toLocaleDateString();
           if(counts[d] !== undefined) counts[d]++;
        });

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new window.Chart(ctx, {
          type: 'bar',
          data: {
            labels: Object.keys(counts),
            datasets: [{
              label: 'Events',
              data: Object.values(counts),
              backgroundColor: '#3f4756',
              hoverBackgroundColor: '#64748b',
              borderRadius: 6,
              borderSkipped: false,
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, grid: { color: '#1a1d24' }, border: { display: false }, ticks: { color: '#64748b', stepSize: 1, font: {family: 'JetBrains Mono', size: 10} } },
              x: { grid: { display: false }, border: { display: false }, ticks: { color: '#64748b', font: {family: 'JetBrains Mono', size: 10} } }
            }
          }
        });
      };

      return (
        <div className="flex-1 overflow-y-auto p-8 lg:p-12 w-full bg-dark-950">
          <header className="mb-10 max-w-4xl mx-auto">
            <h1 className="text-3xl font-bold text-gray-100 flex items-center gap-3">
               Telemetry Array
            </h1>
            <p className="text-gray-500 mt-2 text-sm font-light">System-wide audit trail and analytics.</p>
          </header>

          <div className="max-w-4xl mx-auto bg-dark-900 border border-dark-800 rounded-xl p-8 mb-10 h-80 shadow-tactile">
             <div className="text-[10px] font-mono text-gray-500 uppercase tracking-widest mb-6">Activity Volume (7 Days)</div>
             <div className="h-56 w-full"><canvas ref={chartRef}></canvas></div>
          </div>

          <div className="max-w-4xl mx-auto space-y-4">
            <div className="text-[10px] font-mono text-gray-500 uppercase tracking-widest mb-6 border-b border-dark-800 pb-3">Event Stream</div>
            {loading ? (
               <div className="text-gray-600 font-mono text-xs py-4 flex justify-center"><span className="animate-pulse">Fetching records...</span></div>
            ) : logs.length === 0 ? (
               <div className="text-gray-600 font-mono text-xs py-4 text-center">Stream empty.</div>
            ) : (
              logs.map((log) => {
                const userName = log.expand?.user?.name || log.expand?.user?.email || 'Unknown_Node';
                return (
                  <div key={log.id} className="bg-dark-900/50 hover:bg-dark-900 transition-colors border border-dark-800 p-5 rounded-xl flex items-start gap-5">
                    <div className="mt-1 p-2 bg-dark-800 rounded-lg text-accent-500 border border-dark-700 shadow-inner"><Icons.Activity/></div>
                    <div className="flex-1">
                      <div className="flex justify-between items-start mb-1.5">
                        <div className="text-sm text-gray-300">
                          <span className="font-semibold text-gray-100">{userName}</span> executed <span className="text-accent-400 font-mono text-[10px] uppercase bg-dark-800 border border-dark-700 px-1.5 py-0.5 rounded ml-1">{log.action}</span>
                        </div>
                        <div className="text-[10px] text-gray-500 font-mono bg-dark-950 px-2 py-1 rounded border border-dark-800">{new Date(log.created).toLocaleString()}</div>
                      </div>
                      <div className="text-sm text-gray-400 mt-2 font-light">
                        {log.details}
                      </div>
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      );
    }

    function WorkspaceView({ workspace, api, user, myRole, onSelectDocument, showToast, pinnedDocs, onTogglePin, searchInputRef }) {
      const [documents, setDocuments] = useState([]);
      const [loading, setLoading] = useState(true);
      const [searchQuery, setSearchQuery] = useState('');
      
      const [isDrafting, setIsDrafting] = useState(false);
      const [newTitle, setNewTitle] = useState('');
      const [newContent, setNewContent] = useState('');
      const [creating, setCreating] = useState(false);
      
      const [viewMode, setViewMode] = useState('list');
      const [showMembers, setShowMembers] = useState(false);
      const fileInputRef = useRef(null);
      const contentInputRef = useRef(null);

      // Prevent an older workspace request from overwriting the currently
      // selected workspace when requests finish out of order.
      const docsRequestRef = useRef(0);

      const loadDocs = async (workspaceId = workspace.id) => {
        const requestId = ++docsRequestRef.current;
        setLoading(true);

        try {
          // Use the workspace id captured at the start of this request.
          // The extra client-side filter is intentional: it prevents records
          // from another workspace from ever being rendered if the API returns
          // stale/unfiltered data.
          const filter = encodeURIComponent(`workspace='${workspaceId}'`);
          const res = await api(
            `/api/collections/documents/records?filter=${filter}&sort=-created&expand=author,workspace`
          );

          // Ignore a response that belongs to an older workspace/request.
          if (requestId !== docsRequestRef.current || workspace.id !== workspaceId) {
            return;
          }

          const items = (res.items || []).filter(doc => {
            const relation = doc.workspace;
            const relationId = typeof relation === 'string'
              ? relation
              : relation?.id;
            return relationId === workspaceId;
          });

          setDocuments(items);
        } catch (err) {
          if (requestId === docsRequestRef.current && workspace.id === workspaceId) {
            showToast('Error fetching documents.');
          }
        } finally {
          if (requestId === docsRequestRef.current) {
            setLoading(false);
          }
        }
      };

      useEffect(() => {
        // Invalidate every request belonging to the previous workspace.
        docsRequestRef.current += 1;
        setDocuments([]);
        setSearchQuery('');
        setIsDrafting(false);
        setViewMode('list');

        const workspaceId = workspace.id;
        loadDocs(workspaceId);

        return () => {
          // Anything still in flight for this workspace is now stale.
          docsRequestRef.current += 1;
        };
      }, [workspace.id]);

      const handleCreate = async (e) => {
        e.preventDefault(); if (!newTitle.trim()) return;
        setCreating(true);
        try {
          const file = fileInputRef.current?.files[0];
          let body;
          if (file) {
            const formData = new FormData();
            formData.append('title', newTitle); formData.append('content', newContent);
            formData.append('workspace', workspace.id); formData.append('author', user.id);
            formData.append('attachment', file);
            body = formData;
          } else {
            body = JSON.stringify({ title: newTitle, content: newContent, workspace: workspace.id, author: user.id });
          }
          await api('/api/collections/documents/records', { method: 'POST', body });
          await api('/api/collections/activity_log/records', { method: 'POST', body: JSON.stringify({ action: 'document_created', details: newTitle, user: user.id, workspace: workspace.id }) }).catch(()=>{});

          setNewTitle(''); setNewContent(''); if(fileInputRef.current) fileInputRef.current.value = '';
          setIsDrafting(false);
          showToast('Document committed.');

          // Reload only the workspace that was active when the document was
          // created. If the user switched workspaces while saving, the
          // request will be discarded by loadDocs().
          loadDocs(workspace.id);
        } catch (err) { showToast(`Error: ${err.message}`); } 
        finally { setCreating(false); }
      };

      const filteredDocs = useMemo(() => {
        const query = searchQuery.toLowerCase();
        return documents.filter(d => (d.title || '').toLowerCase().includes(query) || (d.content || '').toLowerCase().includes(query));
      }, [documents, searchQuery]);

      const pinned = filteredDocs.filter(d => pinnedDocs.includes(d.id));
      const unpinned = filteredDocs.filter(d => !pinnedDocs.includes(d.id));

      const DocCard = ({ doc, isPinned }) => (
        <div onClick={() => onSelectDocument(doc)}
          className="bg-dark-900 border border-dark-800 hover:border-dark-600 rounded-xl p-6 cursor-pointer transition-all duration-200 group flex flex-col h-full shadow-tactile hover:shadow-float transform hover:-translate-y-1">
          
          <div className="flex justify-between items-start mb-3 gap-2">
            <h3 className="text-lg font-semibold text-gray-200 group-hover:text-white transition-colors line-clamp-1">{doc.title}</h3>
            <div className="flex gap-1 shrink-0">
              <button onClick={(e) => onTogglePin(doc.id, e)} className={`p-1.5 rounded-md transition-colors ${isPinned ? 'text-yellow-500 bg-yellow-500/10' : 'text-gray-600 hover:text-gray-400 hover:bg-dark-800'}`}>
                <Icons.Star filled={isPinned} />
              </button>
            </div>
          </div>
          <p className="text-gray-400 text-sm mb-6 line-clamp-3 leading-relaxed flex-1 font-light">
            {doc.content || <span className="opacity-50 italic">Empty document matrix...</span>}
          </p>
          <div className="flex items-center gap-3 pt-4 border-t border-dark-800 mt-auto">
            <div className="w-6 h-6 rounded-md border border-dark-700 bg-dark-950 text-gray-400 flex items-center justify-center font-bold text-[10px] shadow-inner">
                {(doc.expand?.author?.name || doc.expand?.author?.email || 'U')[0].toUpperCase()}
            </div>
            <div className="text-[10px] text-gray-500 font-mono tracking-wide">
              {new Date(doc.created).toLocaleDateString()}
            </div>
            {doc.attachment && <div className="ml-auto text-accent-500 bg-dark-950 p-1 rounded border border-dark-800"><Icons.File/></div>}
          </div>
        </div>
      );

      return (
        <div className="flex-1 flex flex-col h-full relative">
          
          {/* Header Controls */}
          <header className="px-10 pt-10 pb-6 border-b border-dark-800 flex flex-col md:flex-row justify-between items-start md:items-end gap-6 shrink-0 bg-dark-950 z-10 sticky top-0">
            <div>
              <div className="text-[10px] font-mono font-medium text-gray-500 uppercase tracking-widest mb-2 flex items-center gap-2">
                Active Workspace
              </div>
              <h1 className="text-3xl font-bold text-gray-100 tracking-tight">{workspace.wname}</h1>
            </div>
            <div className="flex items-center gap-4 w-full md:w-auto">
              <div className="flex bg-dark-900 border border-dark-800 rounded-lg p-1 shadow-inner">
                 <button onClick={() => setViewMode('list')} className="px-3 py-2 rounded-md bg-dark-700 text-white text-xs font-medium flex items-center gap-2"><Icons.Grid/> Documents</button>
              </div>
              <button onClick={() => setShowMembers(true)} className="px-3 py-2.5 bg-dark-900 border border-dark-800 rounded-lg text-xs text-gray-400 hover:text-gray-200 hover:bg-dark-800 transition-colors">
                Members
              </button>
              <div className="relative w-full md:w-72 group">
                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-500"><Icons.Search/></div>
                <input type="text" ref={searchInputRef} placeholder="Search matrix..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                  className="w-full pl-10 pr-12 py-2.5 bg-dark-900 border border-dark-800 rounded-lg text-sm focus:outline-none focus:border-accent-500 transition-all text-gray-200 placeholder-gray-600 shadow-inner" />
                <div className="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                  <span className="text-[9px] font-mono text-gray-500 bg-dark-950 border border-dark-800 px-1.5 py-0.5 rounded shadow-sm">Ctrl K</span>
                </div>
              </div>
            </div>
          </header>

          <div className="flex-1 overflow-y-auto p-10 bg-dark-950">
            
            {/* New Document Editor — viewers cannot create documents */}
            {canEdit(myRole) && (!isDrafting ? (
              <div className="mb-10">
                <button onClick={() => setIsDrafting(true)} className="w-full py-5 border-2 border-dashed border-dark-700 hover:border-accent-600 rounded-xl text-center flex items-center justify-center gap-3 transition-all duration-200 group bg-dark-900/50 hover:bg-dark-900">
                  <div className="text-gray-500 group-hover:text-accent-400 transition-colors p-1 bg-dark-950 rounded-md border border-dark-800 group-hover:border-accent-600"><Icons.Plus /></div>
                  <span className="text-sm font-semibold text-gray-400 group-hover:text-gray-200 transition-colors">Initialize New Document</span>
                </button>
              </div>
            ) : (
              <form onSubmit={handleCreate} className="bg-dark-900 border border-dark-700 rounded-2xl overflow-hidden mb-12 shadow-float">
                <div className="bg-dark-950 border-b border-dark-800 px-5 py-3 flex items-center justify-between">
                   <div className="text-[10px] font-mono text-accent-400 uppercase tracking-widest flex items-center gap-2">
                     <span className="w-2 h-2 rounded-full bg-accent-500 animate-pulse"></span> Document Editor
                  </div>
                  <button type="button" onClick={() => setIsDrafting(false)} className="text-gray-500 hover:text-white transition-colors bg-dark-800 p-1.5 rounded-md"><Icons.Close/></button>
                </div>
                
                <input type="text" placeholder="Document Title" required value={newTitle} onChange={e => setNewTitle(e.target.value)}
                  className="w-full px-8 py-5 bg-transparent border-b border-dark-800 focus:ring-0 font-bold text-2xl outline-none placeholder-gray-700 text-gray-100" />
                
                <div className="min-h-[360px] bg-dark-950/50">
                  <textarea ref={contentInputRef} placeholder="Start writing your document... (plain text)" value={newContent} onChange={e => setNewContent(e.target.value)}
                    className="w-full h-[360px] p-8 bg-transparent border-none focus:ring-0 outline-none resize-none placeholder-gray-700 text-gray-300 text-sm leading-relaxed"></textarea>
                </div>
                
                <div className="flex items-center justify-between p-5 border-t border-dark-800 bg-dark-950">
                  <div className="relative group cursor-pointer">
                    <input type="file" ref={fileInputRef} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                    <div className="flex items-center justify-center gap-2 text-xs font-mono text-gray-400 border border-dark-700 bg-dark-900 group-hover:bg-dark-800 px-4 py-2 rounded-lg transition-colors shadow-inner">
                       <Icons.File /> Attach Binary File
                    </div>
                  </div>
                  <div className="flex gap-3">
                     <button type="button" onClick={() => setIsDrafting(false)} className="px-5 py-2 rounded-lg text-gray-400 text-sm font-medium hover:text-gray-200 hover:bg-dark-800 transition-colors">Abort</button>
                     <button type="submit" disabled={creating} className="tactile-button text-gray-100 px-6 py-2 rounded-lg text-sm font-bold disabled:opacity-70 flex items-center gap-2">
                      {creating ? <span className="w-4 h-4 border-2 border-t-transparent border-gray-400 rounded-full animate-spin"></span> : null}
                      {creating ? 'Committing...' : 'Commit to Matrix'}
                    </button>
                  </div>
                </div>
              </form>
            ))}

            {showMembers && (
              <MembersPanel workspace={workspace} api={api} user={user} role={myRole}
                onClose={() => setShowMembers(false)} showToast={showToast} />
            )}

            {/* Content Display */}
            {loading ? (
               <div className="py-32 flex flex-col items-center justify-center text-gray-500 font-mono text-xs">
                 <div className="w-8 h-8 border-2 border-dark-700 border-t-accent-500 rounded-full animate-spin mb-4"></div>
                 Querying database...
               </div>
            ) : documents.length === 0 ? (
              !isDrafting && (
                <div className="py-24 border border-dashed border-dark-700 rounded-2xl text-center flex flex-col items-center bg-dark-900/30">
                   <div className="text-dark-600 mb-4 bg-dark-950 p-4 rounded-full shadow-inner border border-dark-800"><Icons.Folder /></div>
                   <p className="text-gray-500 font-mono text-xs uppercase tracking-widest">Null Array. Initialize your first document.</p>
                </div>
              )
            ) : (
              <div className="space-y-10">
                {pinned.length > 0 && (
                  <section>
                    <h2 className="text-[10px] font-mono font-bold text-yellow-500/80 uppercase tracking-widest mb-4 flex items-center gap-2"><Icons.Star filled={true}/> Pinned Intel</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {pinned.map(doc => <DocCard key={doc.id} doc={doc} isPinned={true} />)}
                    </div>
                  </section>
                )}
                
                {unpinned.length > 0 && (
                  <section>
                    {pinned.length > 0 && <h2 className="text-[10px] font-mono font-bold text-gray-600 uppercase tracking-widest mb-4 border-t border-dark-800 pt-8">Standard Documents</h2>}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {unpinned.map(doc => <DocCard key={doc.id} doc={doc} isPinned={false} />)}
                    </div>
                  </section>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ========================= RBAC HELPERS =========================
    async function fetchMyRole(api, workspace, userId) {
      if (workspace.owner === userId) return 'owner';
      try {
        const filter = encodeURIComponent(`workspace='${workspace.id}' && user='${userId}'`);
        const res = await api(`/api/collections/workspace_members/records?filter=${filter}`);
        const row = (res.items || [])[0];
        return row ? row.member_role : null;
      } catch {
        return null;
      }
    }

    function canEdit(role) { return role === 'owner' || role === 'editor'; }
    function canManageMembers(role) { return role === 'owner'; }

    function MembersPanel({ workspace, api, user, role, onClose, showToast }) {
      const [members, setMembers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [inviteEmail, setInviteEmail] = useState('');
      const [inviteRole, setInviteRole] = useState('editor');
      const [inviting, setInviting] = useState(false);

      const loadMembers = async () => {
        setLoading(true);
        try {
          const filter = encodeURIComponent(`workspace='${workspace.id}'`);
          const res = await api(`/api/collections/workspace_members/records?filter=${filter}&expand=user`);
          setMembers(res.items || []);
        } catch (err) {
          showToast('Could not load members.');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        loadMembers();
      }, [workspace.id]);

      const handleInvite = async (e) => {
        e.preventDefault();
        if (!canManageMembers(role) || !inviteEmail.trim()) return;
        setInviting(true);
        try {
          const filter = encodeURIComponent(`email='${inviteEmail.trim()}'`);
          const lookup = await api(`/api/collections/users/records?filter=${filter}`);
          const targetUser = (lookup.items || [])[0];
          if (!targetUser) {
            showToast('No user found with that email. They need to sign up first.');
            return;
          }

          // Prevent duplicate membership rows from being added.
          const existingFilter = encodeURIComponent(`workspace='${workspace.id}' && user='${targetUser.id}'`);
          const existing = await api(`/api/collections/workspace_members/records?filter=${existingFilter}`);
          if ((existing.items || []).length > 0) {
            showToast('That user is already a workspace member.');
            return;
          }

          await api('/api/collections/workspace_members/records', {
            method: 'POST',
            body: JSON.stringify({ workspace: workspace.id, user: targetUser.id, member_role: inviteRole }),
          });
          setInviteEmail('');
          await loadMembers();
          showToast('Member added.');
        } catch (err) {
          showToast('Failed to add member: ' + err.message);
        } finally {
          setInviting(false);
        }
      };

      const handleRemove = async (memberId) => {
        if (!canManageMembers(role)) return;
        if (!window.confirm('Remove this member from the workspace?')) return;
        try {
          await api(`/api/collections/workspace_members/records/${memberId}`, { method: 'DELETE' });
          await loadMembers();
          showToast('Member removed.');
        } catch (err) {
          showToast('Failed to remove: ' + err.message);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-dark-950/70 backdrop-blur-md">
          <div className="relative w-full max-w-lg glass-panel rounded-2xl shadow-float p-8 border border-dark-700/50">
            <button onClick={onClose} className="absolute top-5 right-5 text-gray-500 hover:text-gray-300 p-1 rounded-md hover:bg-dark-800">
              <Icons.Close />
            </button>
            <h2 className="text-xl font-bold text-gray-100 mb-1">Workspace Members</h2>
            <p className="text-gray-500 text-sm mb-2">{workspace.wname}</p>
            <p className="text-[10px] font-mono uppercase tracking-widest text-gray-600 mb-6">Your role: {role || 'none'}</p>

            {canManageMembers(role) && (
              <form onSubmit={handleInvite} className="flex flex-col sm:flex-row gap-2 mb-6">
                <input
                  type="email"
                  placeholder="member@email.com"
                  value={inviteEmail}
                  onChange={e => setInviteEmail(e.target.value)}
                  className="flex-1 px-3 py-2 bg-dark-900 border border-dark-700 rounded-lg text-sm text-gray-100 placeholder-gray-600 focus:outline-none focus:border-accent-500"
                />
                <select
                  value={inviteRole}
                  onChange={e => setInviteRole(e.target.value)}
                  className="px-3 py-2 bg-dark-900 border border-dark-700 rounded-lg text-sm text-gray-300"
                >
                  <option value="editor">Editor</option>
                  <option value="viewer">Viewer</option>
                </select>
                <button type="submit" disabled={inviting} className="tactile-button px-4 py-2 rounded-lg text-sm font-semibold text-gray-100">
                  {inviting ? '…' : 'Add'}
                </button>
              </form>
            )}

            <div className="space-y-2 max-h-72 overflow-y-auto">
              {loading ? (
                <div className="text-gray-600 text-xs font-mono py-4 text-center">Loading…</div>
              ) : members.length === 0 ? (
                <div className="text-gray-600 text-xs font-mono py-4 text-center">No members added yet.</div>
              ) : (
                members.map(m => (
                  <div key={m.id} className="flex items-center justify-between bg-dark-900/50 border border-dark-800 rounded-lg px-4 py-2.5">
                    <div>
                      <div className="text-sm text-gray-200">{m.expand?.user?.name || m.expand?.user?.email || m.user}</div>
                      <div className="text-[10px] font-mono text-gray-500 uppercase">{m.member_role}</div>
                    </div>
                    {canManageMembers(role) && (
                      <button onClick={() => handleRemove(m.id)} className="text-gray-600 hover:text-red-400 p-1.5 rounded-md hover:bg-red-400/10" title="Remove member">
                        <Icons.Trash />
                      </button>
                    )}
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    function DocumentDetail({ workspace, doc, api, user, myRole, onBack, onUpdate, onDelete, showToast, isPinned, onTogglePin }) {
      const [comments, setComments] = useState([]);
      const [newComment, setNewComment] = useState('');
      const [editTitle, setEditTitle] = useState(doc.title);
      const [editContent, setEditContent] = useState(doc.content || '');
      const [saving, setSaving] = useState(false);
      const [viewMode, setViewMode] = useState('read');

      useEffect(() => { loadComments(); }, [doc.id]);

      // Re-run prism highlighting when reading or editing
      useEffect(() => {
        if(window.Prism) { setTimeout(() => window.Prism.highlightAll(), 0); }
      }, [viewMode, doc.content, editContent]);

      const loadComments = async () => {
        try {
          const filter = encodeURIComponent(`document='${doc.id}'`);
          const res = await api(`/api/collections/comments/records?filter=${filter}&sort=created&expand=author`);
          setComments(res.items || []);
        } catch (err) {}
      };

      const handleSave = async () => {
        if (!editTitle.trim()) return;
        setSaving(true);
        try {
          await api(`/api/collections/documents/records/${doc.id}`, { method: 'PATCH', body: JSON.stringify({ title: editTitle, content: editContent }) });
          onUpdate({ ...doc, title: editTitle, content: editContent });
          setViewMode('read'); showToast('Edits committed to matrix.');
        } catch (err) { showToast('Error during commit.'); } 
        finally { setSaving(false); }
      };

      const handleDelete = async () => {
        // Implement custom modal instead of basic alert/confirm per rules
        const conf = window.confirm(`Are you sure you want to purge "${doc.title}"?`); // fallback for now to keep it simple, but styled ideally
        if (!conf) return;
        try {
          await api(`/api/collections/documents/records/${doc.id}`, { method: 'DELETE' });
          showToast('Document purged.'); onDelete();
        } catch (err) { showToast('Error during purge.'); }
      };

      const handleShare = async () => {
        const url = `${window.location.origin}${window.location.pathname}?document=${encodeURIComponent(doc.id)}`;
        try {
          if (navigator.share) {
            await navigator.share({ title: doc.title, text: `View ${doc.title} in NexusDocs`, url });
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(url);
            showToast('Document link copied to clipboard.');
          } else {
            window.prompt('Copy this document link:', url);
          }
        } catch (err) {
          if (err?.name !== 'AbortError') showToast('Could not share document.');
        }
      };

      const handleAddComment = async () => {
        if (!newComment.trim()) return;
        try {
          await api('/api/collections/comments/records', { method: 'POST', body: JSON.stringify({ text: newComment, document: doc.id, author: user.id }) });
          await api('/api/collections/activity_log/records', { method: 'POST', body: JSON.stringify({ action: 'comment_added', details: newComment.substring(0,50)+'...', user: user.id, workspace: workspace.id }) }).catch(()=>{});
          setNewComment(''); loadComments();
        } catch (err) {}
      };

      const authorName = doc.expand?.author?.name || doc.expand?.author?.email || 'Unknown';
      const fileUrl = doc.attachment ? `${API_BASE}/api/files/documents/${doc.id}/${doc.attachment}` : null;
      
      if (viewMode === 'edit') {
        return (
          <div className="flex flex-col h-full bg-dark-900">
             <header className="px-6 py-4 border-b border-dark-800 flex justify-between items-center bg-dark-950 shrink-0 shadow-sm">
               <button onClick={() => setViewMode('read')} className="inline-flex items-center gap-2 text-xs font-mono text-gray-400 hover:text-white transition-colors px-3 py-1.5 rounded-md hover:bg-dark-800 border border-transparent hover:border-dark-700">
                 <Icons.ChevronLeft /> Abort Edit
               </button>
               <div className="text-[10px] font-mono text-accent-500 uppercase tracking-widest bg-accent-500/10 px-3 py-1 rounded-full border border-accent-500/20">Active Edit Mode</div>
               <button onClick={handleSave} disabled={saving} className="tactile-button text-gray-100 px-5 py-2 rounded-md text-xs font-bold">
                 {saving ? 'Saving...' : 'Commit Changes'}
               </button>
             </header>

            <div className="flex-1 flex flex-col overflow-hidden">
               <input value={editTitle} onChange={e => setEditTitle(e.target.value)}
                 className="w-full px-10 py-6 text-2xl font-bold text-gray-100 border-b border-dark-800 focus:outline-none bg-dark-950 placeholder-gray-700 shrink-0" placeholder="Title" />
               
               <div className="flex-1 overflow-hidden bg-dark-950/50">
                 <textarea value={editContent} onChange={e => setEditContent(e.target.value)}
                   className="w-full h-full p-10 text-sm text-gray-300 focus:outline-none resize-none bg-transparent leading-7 placeholder-gray-700" placeholder="Edit document text..." />
               </div>
            </div>
          </div>
        );
      }

      return (
        <div className="flex-1 overflow-y-auto w-full flex justify-center scroll-smooth bg-dark-950">
          <div className="w-full max-w-4xl p-10 lg:py-16">
            <button onClick={onBack} className="inline-flex items-center gap-2 text-xs font-mono text-gray-500 hover:text-white mb-10 transition-all group px-3 py-1.5 -ml-3 rounded-lg hover:bg-dark-900 border border-transparent hover:border-dark-800">
              <span className="transform group-hover:-translate-x-1 transition-transform"><Icons.ChevronLeft /></span> Return to Matrix
            </button>
            
            <article className="mb-16">
              <div className="flex flex-col md:flex-row justify-between items-start mb-8 gap-6">
                 <h1 className="text-4xl font-bold text-gray-100 leading-tight tracking-tight">{doc.title}</h1>
                 <div className="flex gap-2 shrink-0 bg-dark-900 p-1.5 rounded-lg border border-dark-800 shadow-inner">
                   <button onClick={onTogglePin} className={`p-2 rounded-md transition-colors border border-transparent ${isPinned ? 'text-yellow-500 bg-yellow-500/10' : 'text-gray-500 hover:text-gray-200 hover:bg-dark-800'}`} title="Pin">
                      <Icons.Star filled={isPinned}/>
                    </button>
                    {canEdit(myRole) && (
                      <button onClick={() => setViewMode('edit')} className="p-2 text-gray-500 hover:text-gray-200 hover:bg-dark-800 rounded-md transition-colors" title="Edit">
                        <Icons.Edit />
                      </button>
                    )}
                    <button onClick={handleShare} className="p-2 text-gray-500 hover:text-gray-200 hover:bg-dark-800 rounded-md transition-colors" title="Share document">
                      <Icons.Share />
                    </button>
                    {canEdit(myRole) && (
                      <button onClick={handleDelete} className="p-2 text-gray-500 hover:text-red-400 hover:bg-red-400/10 rounded-md transition-colors" title="Delete">
                        <Icons.Trash />
                      </button>
                    )}
                </div>
              </div>
              
              <div className="flex items-center gap-4 text-sm mb-12 pb-8 border-b border-dark-800">
                  <div className="w-10 h-10 rounded-xl bg-dark-900 border border-dark-800 text-gray-400 flex items-center justify-center font-bold text-sm shadow-inner">
                    {authorName[0].toUpperCase()}
                  </div>
                  <div>
                    <div className="text-gray-200 font-medium">{authorName}</div>
                    <div className="text-[10px] font-mono text-gray-500 tracking-wide mt-1">{new Date(doc.created).toLocaleString()}</div>
                  </div>
              </div>

              {fileUrl && (
                <div className="flex items-center justify-between p-4 bg-dark-900 border border-dark-800 rounded-xl mb-12 shadow-tactile">
                  <div className="flex items-center gap-3">
                    <div className="p-2 bg-dark-950 rounded-lg text-accent-500 border border-dark-800"><Icons.File /></div>
                    <span className="text-gray-300 text-sm font-mono tracking-wide">{doc.attachment}</span>
                  </div>
                  <a href={fileUrl} target="_blank" download className="tactile-button text-xs font-bold text-gray-300 px-5 py-2.5 rounded-lg transition-colors">
                    Download Binary
                  </a>
                </div>
              )}

              <div className="bg-dark-900/30 p-8 rounded-2xl border border-dark-800/50">
                {doc.content ? (
                  <div className="whitespace-pre-wrap break-words text-gray-300 text-[15px] leading-7">{doc.content}</div>
                ) : (
                  <div className="text-gray-700 text-sm font-mono uppercase tracking-widest">Empty document.</div>
                )}
              </div>
            </article>

            {/* Discussion Thread */}
            <section className="border-t border-dark-800 pt-12">
              <h3 className="text-[10px] font-mono font-bold text-gray-500 uppercase tracking-widest mb-8 flex items-center gap-3">
                Discussion Matrix <span className="bg-dark-800 text-gray-300 px-2 py-0.5 rounded-full">{comments.length}</span>
              </h3>
              
              <div className="space-y-6 mb-10">
                {comments.length === 0 && <div className="text-gray-600 font-mono text-xs bg-dark-900/50 p-6 rounded-xl border border-dark-800 text-center">No communications logged.</div>}
                {comments.map((c, i) => (
                  <div key={c.id} className="flex gap-4 group">
                    <div className="w-8 h-8 rounded-lg bg-dark-900 border border-dark-800 text-gray-400 flex items-center justify-center font-bold text-xs flex-shrink-0 shadow-inner group-hover:border-dark-700 transition-colors">
                      {(c.expand?.author?.name || c.expand?.author?.email || 'A')[0].toUpperCase()}
                    </div>
                    <div className="flex-1 bg-dark-900/50 border border-dark-800 p-4 rounded-2xl rounded-tl-sm group-hover:bg-dark-900 transition-colors">
                      <div className="flex items-center gap-3 mb-2">
                        <span className="font-semibold text-xs text-gray-200">{c.expand?.author?.name || c.expand?.author?.email || 'Unknown'}</span>
                        <span className="text-[10px] font-mono text-gray-600">{new Date(c.created).toLocaleString()}</span>
                      </div>
                      <p className="text-gray-400 text-sm whitespace-pre-wrap leading-relaxed font-light">{c.text}</p>
                    </div>
                  </div>
                ))}
              </div>

              <div className="flex gap-4">
                 <div className="w-8 h-8 rounded-lg bg-dark-800 border border-dark-700 text-gray-400 flex items-center justify-center font-bold text-xs flex-shrink-0 shadow-inner">
                    {(user?.name || user?.email || 'U')[0].toUpperCase()}
                 </div>
                 <div className="flex-1 relative">
                   <textarea value={newComment} onChange={e => setNewComment(e.target.value)} placeholder="Transmit message to team..."
                     className="w-full bg-dark-900 border border-dark-800 rounded-xl p-4 text-sm focus:outline-none focus:border-accent-600 focus:ring-1 focus:ring-accent-600/30 resize-y min-h-[100px] text-gray-200 placeholder-gray-600 transition-all shadow-inner" />
                   <div className="mt-3 flex justify-end">
                     <button onClick={handleAddComment} disabled={!newComment.trim()} className="tactile-button text-gray-100 px-6 py-2.5 rounded-lg text-xs font-bold disabled:opacity-50">
                       Transmit
                     </button>
                   </div>
                 </div>
              </div>
            </section>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
