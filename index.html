<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusDocs — Advanced Knowledge Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script src="config.js" onerror="console.log('config.js not found, using default URL')"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            // Classy, premium dark palette - NO NEON
            dark: {
              950: '#080a0d', 
              900: '#12161c', 
              800: '#1d2430', 
              700: '#303948', 
              600: '#4a5568', 
            },
            accent: {
              400: '#94a3b8', // Slate
              500: '#64748b',
              600: '#475569',
            }
          },
          boxShadow: {
            'tactile': '0 1px 2px 0 rgba(0, 0, 0, 0.3), inset 0 1px 0 0 rgba(255, 255, 255, 0.05)',
            'float': '0 20px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 0 0 rgba(255, 255, 255, 0.1)',
            'glow': '0 0 20px rgba(148, 163, 184, 0.15)',
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #050505; color: #e5e5e5; margin: 0; overflow-x: hidden; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2f3a; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f4756; }
    
    .glass-panel { 
      background: rgba(15, 17, 21, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255,255,255,0.05);
    }
    
    .tactile-button {
      background: linear-gradient(180deg, #2a2f3a 0%, #1a1d24 100%);
      border: 1px solid #3f4756;
      box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.1), 0 2px 4px rgba(0,0,0,0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tactile-button:hover:not(:disabled) {
      background: linear-gradient(180deg, #3f4756 0%, #2a2f3a 100%);
      border-color: #64748b;
      transform: translateY(-1px);
      box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.15), 0 4px 8px rgba(0,0,0,0.5);
    }
    .tactile-button:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    }

    /* Modern Markdown Styling */
    .prose { max-width: 100%; color: #d4d4d8; }
    .prose h1, .prose h2, .prose h3 { color: #f8fafc; font-weight: 600; letter-spacing: -0.02em; }
    .prose h1 { font-size: 2.25rem; margin-bottom: 1.5rem; }
    .prose h2 { font-size: 1.5rem; margin-top: 2rem; border-bottom: 1px solid #2a2f3a; padding-bottom: 0.5rem; }
    .prose p { margin-bottom: 1.2rem; line-height: 1.7; color: #cbd5e1; }
    .prose a { color: #f8fafc; text-decoration: underline; text-decoration-color: #64748b; text-underline-offset: 4px; transition: all 0.2s; }
    .prose a:hover { text-decoration-color: #f8fafc; }
    .prose code:not([class*="language-"]) { background: #1a1d24; border: 1px solid #2a2f3a; color: #e2e8f0; padding: 0.2rem 0.4rem; border-radius: 0.375rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
    .prose blockquote { border-left: 2px solid #64748b; padding-left: 1.25rem; color: #94a3b8; font-style: italic; }
    .prose pre { background: #050505 !important; border: 1px solid #2a2f3a; border-radius: 0.5rem; padding: 1rem; overflow-x: auto; margin: 1.5rem 0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
    
    /* Preserve Vanta Container Z-Index */
    #vanta-bg { position: absolute; z-index: 0; top: 0; left: 0; width: 100%; height: 100%; }

    /* Clearer surfaces: preserve the dark aesthetic without losing visual hierarchy */
    .landing-noise { position:absolute; inset:0; z-index:1; pointer-events:none; background: radial-gradient(circle at 72% 22%, rgba(148,163,184,.10), transparent 30%), linear-gradient(180deg, rgba(5,5,5,.28), rgba(5,5,5,.72)); }
    .demo-shell { box-shadow: 0 25px 80px rgba(0,0,0,.40), inset 0 1px 0 rgba(255,255,255,.08); background: rgba(18,22,28,.78); }

    .landing-noise { position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.14; background-image:radial-gradient(rgba(255,255,255,.18) .6px, transparent .6px); background-size:5px 5px; mask-image:linear-gradient(to bottom, black, transparent 85%); }
    .demo-shell { box-shadow: 0 30px 80px rgba(0,0,0,.28); }
    .demo-shell button:focus-visible, .demo-shell textarea:focus-visible { outline: 1px solid #94a3b8; outline-offset: 2px; }
    .prose ul { padding-left:1.25rem; list-style:disc; }
    .prose li { margin:.4rem 0; color:#94a3b8; }
  </style>
</head>
<body class="font-sans antialiased text-gray-300 selection:bg-accent-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    const API_BASE = window.__NEXUSDOCS_API_BASE__ || "http://localhost:8090";

    const Icons = {
      Logo: () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>,
      Activity: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>,
      Search: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
      Star: ({ filled }) => <svg width="16" height="16" viewBox="0 0 24 24" fill={filled ? "#fbbf24" : "none"} stroke={filled ? "#fbbf24" : "currentColor"} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
      Folder: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>,
      Plus: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
      File: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>,
      Grid: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
      Network: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>,
      LogOut: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
      ChevronLeft: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"/></svg>,
      Trash: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>,
      Edit: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
      Share: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>,
      Close: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
    };

    function App() {
      const [token, setToken] = useState(() => localStorage.getItem('nd_token') || null);
      const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('nd_user') || 'null'));
      const [toastMsg, setToastMsg] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login');

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      const handleLogin = (newToken, newUser) => {
        setToken(newToken);
        setUser(newUser);
        localStorage.setItem('nd_token', newToken);
        localStorage.setItem('nd_user', JSON.stringify(newUser));
        setShowAuthModal(false);
        showToast(`Secure connection established.`);
      };

      const handleLogout = () => {
        setToken(null); setUser(null);
        localStorage.removeItem('nd_token'); localStorage.removeItem('nd_user');
      };

      const api = async (path, opts = {}) => {
        const isFormData = opts.body instanceof FormData;
        const headers = { ...(opts.headers || {}) };
        if (!isFormData) headers['Content-Type'] = 'application/json';
        if (token) headers['Authorization'] = `Bearer ${token}`;

        const res = await fetch(`${API_BASE}${path}`, { ...opts, headers });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const details = data.data || data.errors;
          if (Array.isArray(details) && details.length) {
            const msg = details.map(d => `${d.field ? d.field + ': ' : ''}${d.message}`).join('; ');
            throw new Error(msg);
          }
          throw new Error(data.message || `Request failed (${res.status})`);
        }
        return data;
      };

      return (
        <div className="min-h-screen w-full flex flex-col font-sans relative bg-dark-950 text-gray-300">
          {!token ? (
            <LandingPage onOpenAuth={(mode) => { setAuthMode(mode); setShowAuthModal(true); }} />
          ) : (
            <MainApp user={user} api={api} onLogout={handleLogout} showToast={showToast} />
          )}

          {showAuthModal && !token && (
            <AuthModal initialMode={authMode} onClose={() => setShowAuthModal(false)} onLogin={handleLogin} api={api} />
          )}

          <div className={`fixed bottom-8 right-8 z-[100] bg-dark-800 border border-dark-700 px-6 py-4 rounded-lg shadow-float font-mono text-xs transition-all duration-400 transform flex items-center gap-3 backdrop-blur-md bg-opacity-90 ${toastMsg ? 'translate-y-0 opacity-100' : 'translate-y-4 opacity-0 pointer-events-none'}`}>
             <div className="w-2 h-2 rounded-full bg-accent-500 shadow-[0_0_8px_#64748b]"></div> {toastMsg}
          </div>
        </div>
      );
    }

    function TiltCard({ title, description, icon, delay }) {
      const cardRef = useRef(null);
      const [style, setStyle] = useState({});

      useEffect(() => {
        if (window.gsap && cardRef.current) {
          gsap.fromTo(cardRef.current, 
            { y: 30, opacity: 0 }, 
            { y: 0, opacity: 1, duration: 0.8, delay: delay, ease: "power3.out" }
          );
        }
      }, [delay]);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        
        setStyle({
          transform: `perspective(1000px) rotateY(${x * 15}deg) rotateX(${-y * 15}deg) translateY(-5px)`,
          boxShadow: `0 15px 30px -10px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1), ${-x * 20}px ${-y * 20}px 30px rgba(100, 116, 139, 0.05)`
        });
      };

      return (
        <div 
          ref={cardRef}
          onMouseMove={handleMouseMove} 
          onMouseLeave={() => setStyle({ transform: 'perspective(1000px) rotateY(0deg) rotateX(0deg) translateY(0)', boxShadow: '' })}
          className="glass-panel p-8 rounded-2xl transition-all duration-200 ease-out flex flex-col items-start gap-4" 
          style={style}
        >
          <div className="p-3 bg-dark-800 rounded-lg border border-dark-700 text-accent-400">
            {icon}
          </div>
          <h3 className="text-lg font-semibold text-gray-100">{title}</h3>
          <p className="text-sm text-gray-400 leading-relaxed font-light">{description}</p>
        </div>
      );
    }

    function LandingPage({ onOpenAuth }) {
      const vantaRef = useRef(null);
      const vantaEffect = useRef(null);
      const [demoMode, setDemoMode] = useState('workspace');
      const [activeDoc, setActiveDoc] = useState('architecture');
      const [query, setQuery] = useState('');
      const [comment, setComment] = useState('');
      const [comments, setComments] = useState([
        { author: 'Maya', text: 'Can we document the auth flow here?', time: '8m' },
        { author: 'Alex', text: 'Added the API endpoint details below.', time: '21m' }
      ]);
      const [events, setEvents] = useState([
        { action: 'updated', actor: 'Alex', text: 'API Reference', time: '4m ago' },
        { action: 'commented', actor: 'Maya', text: 'Architecture', time: '8m ago' },
        { action: 'created', actor: 'Sam', text: 'Deployment Guide', time: '32m ago' }
      ]);

      const demoDocs = [
        { id: 'architecture', title: 'Architecture', type: 'Design', author: 'Alex', updated: '4m ago', content: 'System architecture, services, data flow and deployment decisions.', comments: 6 },
        { id: 'api', title: 'API Reference', type: 'Reference', author: 'Maya', updated: '12m ago', content: 'Endpoints, authentication, request formats and response examples.', comments: 11 },
        { id: 'deployment', title: 'Deployment Guide', type: 'Guide', author: 'Sam', updated: '32m ago', content: 'Environment setup, deployment steps and production configuration.', comments: 3 },
        { id: 'decisions', title: 'Technical Decisions', type: 'Decision', author: 'Alex', updated: '1h ago', content: 'Why the team chose the current architecture and implementation tradeoffs.', comments: 8 }
      ];

      const workspaces = [
        { name: 'Product Engineering', count: 18 },
        { name: 'Design Docs', count: 7 },
        { name: 'Onboarding', count: 11 }
      ];

      const selectedDoc = demoDocs.find(d => d.id === activeDoc) || demoDocs[0];
      const filteredDocs = demoDocs.filter(d => {
        const q = query.toLowerCase();
        return !q || d.title.toLowerCase().includes(q) || d.content.toLowerCase().includes(q) || d.type.toLowerCase().includes(q);
      });

      useEffect(() => {
        if (!vantaEffect.current && window.VANTA && vantaRef.current) {
          vantaEffect.current = window.VANTA.NET({
            el: vantaRef.current, mouseControls: true, touchControls: true, gyroControls: false,
            minHeight: 200, minWidth: 200, scale: 1, scaleMobile: 1,
            color: 0x475569, backgroundColor: 0x080a0d, points: 12, maxDistance: 22, spacing: 16, showDots: true
          });
        }
        if (window.gsap) gsap.fromTo('.hero-enter', { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: .8, stagger: .08, ease: 'power3.out' });
        return () => { if (vantaEffect.current) vantaEffect.current.destroy(); };
      }, []);

      const addEvent = (action, actor, text) => {
        setEvents(prev => [{ action, actor, text, time: 'just now' }, ...prev].slice(0, 6));
      };

      const addComment = () => {
        if (!comment.trim()) return;
        setComments(prev => [...prev, { author: 'You', text: comment.trim(), time: 'just now' }]);
        addEvent('commented', 'You', selectedDoc.title);
        setComment('');
      };

      return (
        <div className="w-full min-h-screen flex flex-col relative overflow-hidden bg-dark-950">
          <div ref={vantaRef} id="vanta-bg"></div>
          <div className="landing-noise"></div>

          <nav className="relative z-20 w-full px-6 md:px-10 py-5 flex items-center justify-between border-b border-white/5 bg-dark-950/35 backdrop-blur-xl">
            <div className="flex items-center gap-3 text-gray-100">
              <div className="text-accent-400"><Icons.Logo /></div>
              <span className="text-lg font-bold tracking-tight">NexusDocs</span>
              <span className="hidden sm:inline text-[10px] font-mono text-gray-600 border border-dark-700 px-2 py-1 rounded-full">COLLABORATIVE KNOWLEDGE HUB</span>
            </div>
            <div className="flex items-center gap-2 md:gap-4">
              <button onClick={() => document.getElementById('product-demo')?.scrollIntoView({behavior:'smooth'})} className="hidden md:block text-sm text-gray-400 hover:text-white px-3 py-2">Explore</button>
              <button onClick={() => onOpenAuth('login')} className="text-sm text-gray-400 hover:text-white px-3 py-2">Log in</button>
              <button onClick={() => onOpenAuth('signup')} className="tactile-button text-sm font-semibold text-gray-100 px-5 py-2.5 rounded-lg">Start workspace</button>
            </div>
          </nav>

          <main className="relative z-20 flex-1 px-5 md:px-8 pt-16 md:pt-24 pb-24">
            <section className="max-w-7xl mx-auto grid lg:grid-cols-[.9fr_1.1fr] gap-12 items-center">
              <div className="max-w-3xl">
                <div className="hero-enter inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-dark-700 bg-dark-900/55 backdrop-blur text-gray-400 text-xs font-mono mb-7">
                  <span className="w-1.5 h-1.5 rounded-full bg-gray-300 animate-pulse"></span>
                  A workspace for living documentation
                </div>
                <h1 className="hero-enter text-5xl md:text-7xl font-semibold text-white leading-[1.02] tracking-[-0.045em] mb-7">
                  Documents are only useful<br />
                  <span className="text-gray-500">when teams can work with them.</span>
                </h1>
                <p className="hero-enter text-base md:text-lg text-gray-400 max-w-2xl leading-relaxed mb-9">
                  NexusDocs brings workspaces, documents, search, comments and an activity history into one place — so a team can find information, review it and understand what changed.
                </p>
                <div className="hero-enter flex flex-wrap gap-3">
                  <button onClick={() => onOpenAuth('signup')} className="bg-white hover:bg-gray-100 text-dark-950 font-semibold px-6 py-3 rounded-lg transition-transform hover:-translate-y-0.5">Create your workspace</button>
                  <button onClick={() => document.getElementById('product-demo')?.scrollIntoView({behavior:'smooth'})} className="border border-dark-700 bg-dark-900/50 hover:bg-dark-800 text-gray-200 px-6 py-3 rounded-lg backdrop-blur">See how it works →</button>
                </div>
                <div className="hero-enter flex flex-wrap gap-x-6 gap-y-2 mt-7 text-xs text-gray-600 font-mono">
                  <span>Workspaces</span><span>Documents</span><span>Search</span><span>Comments</span><span>Activity history</span>
                </div>
              </div>

              {/* Real product-shaped preview rather than an abstract graphic */}
              <div className="hero-enter rounded-2xl border border-white/10 bg-dark-950/75 backdrop-blur-2xl shadow-2xl overflow-hidden">
                <div className="flex items-center gap-2 px-4 py-3 border-b border-white/5 bg-white/[.02]">
                  <span className="w-2 h-2 rounded-full bg-gray-500"></span><span className="w-2 h-2 rounded-full bg-gray-700"></span><span className="w-2 h-2 rounded-full bg-gray-800"></span>
                  <span className="ml-3 text-[10px] font-mono text-gray-600">Product Engineering</span>
                  <span className="ml-auto text-[10px] font-mono text-gray-500">18 DOCUMENTS</span>
                </div>
                <div className="grid grid-cols-[150px_1fr] min-h-[380px]">
                  <div className="border-r border-white/5 bg-black/10 p-3">
                    <div className="text-[9px] font-mono uppercase tracking-widest text-gray-600 px-2 mb-3">Workspaces</div>
                    {workspaces.map((w,i)=><div key={w.name} className={`px-2.5 py-2 rounded-md text-[11px] mb-1 ${i===0?'bg-dark-800 text-gray-200':'text-gray-600'}`}><div>{w.name}</div><div className="text-[9px] text-gray-700 mt-1">{w.count} docs</div></div>)}

                  <div className="p-5">
                    <div className="flex items-center justify-between mb-5">
                      <div><div className="text-[9px] font-mono text-gray-600 uppercase">Workspace</div><div className="text-lg text-white mt-1">Product Engineering</div></div>
                      <div className="text-[9px] font-mono text-gray-600">RECENT ACTIVITY</div>

                        <div className="flex justify-between"><span className="text-sm text-gray-200">{d.title}</span><span className="text-[9px] font-mono text-gray-600">{d.updated}</span></div>
                        <div className="text-[10px] text-gray-600 mt-1">{d.type} · {d.comments} comments · {d.author}</div>
                      </button>)}
                    </div>
                    <div className="mt-5 pt-4 border-t border-white/5 flex gap-5 text-[10px] font-mono text-gray-600"><span><b className="text-gray-300">18</b> docs</span><span><b className="text-gray-300">42</b> comments</span><span><b className="text-gray-300">126</b> events</span></div>
                  </div>
                </div>
              </div>
            </section>

            <section id="product-demo" className="max-w-7xl mx-auto mt-24 scroll-mt-8">
              <div className="flex flex-col md:flex-row md:items-end justify-between gap-5 mb-7">
                <div>
                  <div className="text-[10px] font-mono uppercase tracking-[.2em] text-gray-600 mb-2">Product workflow</div>
                  <h2 className="text-2xl md:text-3xl font-semibold text-white">See what a team actually does inside NexusDocs.</h2>
                  <p className="text-sm text-gray-500 mt-2">These interactions mirror the actual workspace capabilities instead of being decorative demos.</p>
